name: Publish statistics and retain 30 days
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: statistics-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate aggregate-only fields
        run: python3 scripts/validate_public.py
      - name: Retain current 30-day statistics
        run: python3 scripts/trim_data.py
      - name: Save current statistics snapshot
        run: |
          if ! git diff --quiet -- public/data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data.json
            git commit -m 'Retain current 30-day statistics'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy statistics website
        id: deployment
        uses: actions/deploy-pages@v4
